    * { box-sizing: border-box; }

    /* ── Tab active states ── */
    .level-tab.active  { background: var(--primary); color: var(--primary-foreground); }
    .section-tab.active { border-bottom: 3px solid var(--primary); color: var(--primary); }

    /* ── Hangul grid cells ── */
    .hangul-cell {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 6px; cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      background: var(--card);
    }
    .hangul-cell:hover { transform: scale(1.08); box-shadow: 0 4px 16px rgba(0,0,0,.18); }
    .hangul-cell .kor  { font-size: 2rem; font-weight: 700; line-height: 1; }
    .hangul-cell .rom  { font-size: .78rem; color: var(--muted-foreground); margin-top: 4px; }
    .hangul-cell .play { font-size: .7rem; color: var(--primary); margin-top: 2px; }

    /* ── Flash cards ── */
    .flashcard-wrap { perspective: 800px; cursor: pointer; }
    .flashcard {
      width: 100%; min-height: 180px; position: relative;
      transform-style: preserve-3d; transition: transform .5s;
    }
    .flashcard.flipped { transform: rotateY(180deg); }
    .flashcard-face {
      position: absolute; inset: 0; backface-visibility: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border-radius: 16px; padding: 20px; border: 1px solid var(--border);
      background: var(--card);
    }
    .flashcard-back { transform: rotateY(180deg); }

    /* ── Quiz ── */
    .quiz-opt {
      display: block; width: 100%; text-align: left; padding: 12px 16px;
      border: 1.5px solid var(--border); border-radius: 10px; cursor: pointer;
      background: var(--card); color: var(--foreground); margin-bottom: 8px;
      transition: background .15s, border-color .15s;
    }
    .quiz-opt:hover { border-color: var(--primary); background: var(--accent); }
    .quiz-opt.correct { background: #22c55e22; border-color: #22c55e; color: #16a34a; }
    .quiz-opt.wrong   { background: #ef444422; border-color: #ef4444; color: #dc2626; }
    .quiz-opt:disabled { cursor: default; }

    /* ── Progress bar ── */
    .progress-bar { height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 999px; background: var(--primary); transition: width .4s; }

    /* ── Audio viz button ── */
    .audio-btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
      border-radius: 999px; border: 1.5px solid var(--primary); cursor: pointer;
      color: var(--primary); background: transparent; font-size: .85rem; font-weight: 600;
      transition: background .15s; vertical-align: middle;
    }
    .audio-btn:hover { background: var(--primary); color: var(--primary-foreground); }

    /* ── Stroke demo canvas ── */
    .stroke-canvas { border: 1px solid var(--border); border-radius: 12px; background: var(--card); }

    /* ── Scroll ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

    /* ── Particle banner ── */
    #hero-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    /* fade in sections */
    .fade-in { animation: fadeIn .35s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* ── Matching game ── */
    .match-card {
      padding: 10px; border: 2px solid var(--border); border-radius: 8px; cursor: pointer;
      text-align: center; font-weight: 600; transition: all .2s; background: var(--card);
      min-height: 52px; display: flex; align-items: center; justify-content: center;
    }
    .match-card.selected { border-color: var(--primary); background: var(--accent); }
    .match-card.matched   { border-color: #22c55e; background: #22c55e22; color: #16a34a; opacity: .6; pointer-events: none; }
    .match-card.wrong-shake { animation: shake .3s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  </style>

<!-- ══════════════════  AUDIO ENGINE  ══════════════════ -->
<script>
/* ─ Web Speech API TTS ─ */
function speak(text, lang = 'ko-KR') {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = 0.85; u.pitch = 1.05;
  const voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('ko'));
  if (voices.length) u.voice = voices[0];
  speechSynthesis.speak(u);
}
// Pre-load voices
speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();

/* ─ Particle hero canvas ─ */
(function(){
  const cv = document.getElementById('hero-canvas');
  const ctx = cv.getContext('2d');
  const chars = '가나다라마바사아자차카타파하한국어';
  let particles = [];
  function resize(){ cv.width = cv.offsetWidth; cv.height = cv.offsetHeight; }
  window.addEventListener('resize', resize); resize();
  for (let i = 0; i < 40; i++) particles.push({
    x: Math.random()*1000, y: Math.random()*200, s: Math.random()*20+12,
    a: Math.random()*Math.PI*2, sp: (.2+Math.random()*.5)*(Math.random()<.5?1:-1),
    op: .08+Math.random()*.18, c: chars[Math.floor(Math.random()*chars.length)]
  });
  function frame(){
    ctx.clearRect(0,0,cv.width,cv.height);
    particles.forEach(p=>{
      p.a += p.sp * .01; p.x += Math.cos(p.a)*.4; p.y += .3;
      if(p.y > cv.height+30) p.y = -30;
      if(p.x < -30) p.x = cv.width+30;
      if(p.x > cv.width+30) p.x = -30;
      ctx.font = `${p.s}px serif`; ctx.fillStyle = `rgba(255,255,255,${p.op})`;
      ctx.fillText(p.c, p.x, p.y);
    });
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>

<script>

/* ── Build level tab bar ── */
function buildLevelTabs() {

function selectLevel(id) {

    btn.style.border = 'none';

  renderMain();
}

/* ── Render main content ── */
function renderMain() {
  const lv = LEVELS.find(l => l.id === currentLevel);
  const main = document.getElementById('mainContent');

  // Level header
  let html = `
    <div class="fade-in mb-6 p-5 rounded-2xl border border-[var(--border)] bg-[var(--card)]"
         style="border-left: 5px solid ${lv.color};">

          <h2 class="text-2xl font-black" style="color:${lv.color}">${lv.label}</h2>
          <p class="text-[var(--muted-foreground)] text-sm mt-1">${lv.desc}</p>
        </div>
      </div>
    </div>`;

  // Section tabs
  html += `<div class="flex gap-1 border-b border-[var(--border)] mb-6 overflow-x-auto">`;
  lv.sections.forEach((s, i) => {
    html += `<button onclick="selectSection(${i})" id="st-${i}"
      class="section-tab px-4 py-2 font-semibold text-sm whitespace-nowrap transition-all text-[var(--muted-foreground)] hover:text-[var(--foreground)]"
      ${i===currentSection ? 'style="border-bottom:3px solid '+lv.color+';color:'+lv.color+'"':''}>

  });

  // Section content
  html += `<div id="sectionContent" class="fade-in">${renderSection(lv, currentSection)}</div>`;
  main.innerHTML = html;
}

function selectSection(i) {
  currentSection = i;
  document.querySelectorAll('.section-tab').forEach((b,j) => {
    b.style.borderBottom = '';
    b.style.color = '';
  });
  const lv = LEVELS.find(l => l.id === currentLevel);
  const btn = document.getElementById('st-'+i);
  if (btn) { btn.style.borderBottom = `3px solid ${lv.color}`; btn.style.color = lv.color; }
  document.getElementById('sectionContent').outerHTML = `<div id="sectionContent" class="fade-in">${renderSection(lv, i)}</div>`;
}

/* ── Route sections ── */
function renderSection(lv, idx) {
  const name = lv.sections[idx];

  if (name === 'Vocabulario') return renderVocab(lv.id);

  h += `<div class="p-5 rounded-xl bg-[var(--card)] border border-[var(--border)]">

/* syllable builder state */
let _cons = '', _vow = '';
const CONS_MAP = {ㄱ:'g',ㄴ:'n',ㄷ:'d',ㄹ:'r',ㅁ:'m',ㅂ:'b',ㅅ:'s',ㅇ:'',ㅈ:'j',ㅎ:'h'};
const VOW_MAP  = {ㅏ:'a',ㅑ:'ya',ㅓ:'eo',ㅕ:'yeo',ㅗ:'o',ㅛ:'yo',ㅜ:'u',ㅠ:'yu',ㅡ:'eu',ㅣ:'i'};
// Compose unicode syllable from jamo
function composeSyllable(c, v) {
  const initials = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const medials  = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
  const ci = initials.indexOf(c); const mi = medials.indexOf(v);
  if (ci < 0 || mi < 0) return c+v;
  return String.fromCharCode(0xAC00 + ci*21*28 + mi*28);
}
function pickCons(c) {
  _cons = c;
  document.querySelectorAll('#consRow button').forEach(b => b.style.borderColor='');
  const btn = document.getElementById('cons-'+c);
  if (btn) btn.style.borderColor = 'var(--primary)';
  updateSyllable();
}
function pickVow(v) {
  _vow = v;
  document.querySelectorAll('#vowRow button').forEach(b => b.style.borderColor='');
  const btn = document.getElementById('vow-'+v);
  if (btn) btn.style.borderColor = 'var(--primary)';
  updateSyllable();
}
function updateSyllable() {
  const el = document.getElementById('syllResult');
  if (!el) return;
  if (_cons && _vow) {
    const syll = composeSyllable(_cons, _vow);
    const rom = (CONS_MAP[_cons]||'')+(VOW_MAP[_vow]||'');
    el.innerHTML = `<div>${syll}</div><div class="text-base font-normal text-[var(--muted-foreground)] mt-1">${rom}</div><button class="audio-btn mt-2" onclick="speak('${syll}')">🔊 Escuchar</button>`;
  } else {
    el.textContent = '?';
  }
}

let fcIdx = 0, fcFlipped = false;
function renderFlashcards(lvId) {
  fcIdx = 0; fcFlipped = false;
  const words = VOCAB[lvId] || [];
  if (!words.length) return '<p>No hay palabras para este nivel.</p>';
  return `<div class="max-w-md mx-auto space-y-5">
    <div class="flex items-center justify-between mb-2">
      <span class="text-sm text-[var(--muted-foreground)]">Tarjeta <span id="fcNum">1</span> de ${words.length}</span>
      <div class="progress-bar w-32"><div class="progress-fill" id="fcProg" style="width:${100/words.length}%"></div></div>
    </div>
    <div class="flashcard-wrap" onclick="flipCard()">
      <div class="flashcard" id="theCard">
        <div class="flashcard-face flashcard-front">
          <div class="text-5xl mb-2" id="fcEmoji">${words[0].emoji}</div>
          <div class="text-4xl font-black" id="fcKor">${words[0].k}</div>
          <div class="text-sm text-[var(--muted-foreground)] mt-2">Haz clic para voltear</div>
        </div>
        <div class="flashcard-face flashcard-back">
          <div class="text-5xl mb-2">${words[0].emoji}</div>
          <div class="text-2xl font-black" id="fcEs">${words[0].es}</div>
          <div class="text-sm text-[var(--muted-foreground)]" id="fcRom">${words[0].r}</div>
          <button class="audio-btn mt-3" onclick="event.stopPropagation();speak('${words[0].k}')">🔊 Escuchar</button>
        </div>
      </div>
    </div>
    <div class="flex gap-3 justify-center">
      <button onclick="prevCard('${lvId}')" class="px-5 py-2 rounded-full border border-[var(--border)] font-semibold text-sm hover:bg-[var(--accent)]">← Anterior</button>
      <button onclick="flipCard()" class="px-5 py-2 rounded-full border border-[var(--primary)] text-[var(--primary)] font-semibold text-sm hover:bg-[var(--primary)] hover:text-[var(--primary-foreground)]">Voltear</button>
      <button onclick="nextCard('${lvId}')" class="px-5 py-2 rounded-full border border-[var(--border)] font-semibold text-sm hover:bg-[var(--accent)]">Siguiente →</button>
    </div>
    <p class="text-center text-xs text-[var(--muted-foreground)]">💡 También puedes hacer clic en la tarjeta para voltearla</p>
  </div>`;
}
function flipCard() {
  fcFlipped = !fcFlipped;
  document.getElementById('theCard')?.classList.toggle('flipped', fcFlipped);
}
function goToCard(lvId, idx) {
  const words = VOCAB[lvId] || [];
  if (idx < 0 || idx >= words.length) return;
  fcIdx = idx; fcFlipped = false;
  const card = document.getElementById('theCard');
  if (!card) return;
  card.classList.remove('flipped');
  document.getElementById('fcEmoji').textContent = words[idx].emoji;
  document.getElementById('fcKor').textContent   = words[idx].k;
  document.getElementById('fcEs').textContent    = words[idx].es;
  document.getElementById('fcRom').textContent   = words[idx].r;
  document.getElementById('fcNum').textContent   = idx+1;
  document.getElementById('fcProg').style.width  = `${(idx+1)*100/words.length}%`;
  // update audio button
  const audBtn = card.querySelector('.audio-btn');
  if (audBtn) audBtn.setAttribute('onclick', `event.stopPropagation();speak('${words[idx].k}')`);
}
function nextCard(lvId){ goToCard(lvId, fcIdx+1); }
function prevCard(lvId){ goToCard(lvId, fcIdx-1); }

/* ═══════  EJERCICIOS SECTION  ═══════ */
let quizState = { current: 0, score: 0, answered: false };
function renderEjercicios(lvId) {
  quizState = { current: 0, score: 0, answered: false };
  return renderQuizUI(lvId);
}
function renderQuizUI(lvId) {
  const qs = QUIZZES[lvId] || [];
  if (!qs.length) return '<p>Ejercicios próximamente.</p>';
  return `<div class="max-w-lg mx-auto space-y-5">
    <!-- Progress -->
    <div class="flex items-center justify-between">
      <span class="text-sm font-semibold">Pregunta <span id="qNum">1</span> de ${qs.length}</span>
      <span class="text-sm font-semibold text-[var(--primary)]">Puntuación: <span id="qScore">0</span></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="quizProg" style="width:${100/qs.length}%"></div></div>

    <!-- Question card -->
    <div id="quizCard" class="p-6 rounded-2xl border border-[var(--border)] bg-[var(--card)]">
      <p class="font-bold text-lg mb-5" id="qText">${qs[0].q}</p>
      <div id="qOpts">
        ${qs[0].opts.map((o,i)=>`<button class="quiz-opt" onclick="answerQuiz('${lvId}',${i})">${o}</button>`).join('')}

    </div>

    <!-- Next button -->
    <div class="text-center">
      <button id="nextQBtn" onclick="nextQuestion('${lvId}')" class="hidden px-8 py-3 rounded-full font-bold" style="background:var(--primary);color:var(--primary-foreground)">
        Siguiente →
      </button>
    </div>

    <!-- Matching game below -->
    <div class="mt-8">
      <h3 class="font-bold text-base mb-3">🎮 Juego de Emparejamiento</h3>
      <p class="text-sm text-[var(--muted-foreground)] mb-4">Une cada palabra coreana con su traducción.</p>
      ${renderMatchGame(lvId)}
    </div>

    <!-- Completion -->
    <div id="quizComplete" class="hidden text-center p-8 rounded-2xl border border-[var(--border)] bg-[var(--card)]">
      <div class="text-5xl mb-3">🎉</div>
      <h3 class="text-2xl font-black mb-2">¡Completado!</h3>
      <p class="text-[var(--muted-foreground)] mb-4">Tu puntuación: <span id="finalScore" class="text-[var(--primary)] font-black text-xl"></span></p>
      <button onclick="restartQuiz('${lvId}')" class="px-6 py-2 rounded-full font-bold" style="background:var(--primary);color:var(--primary-foreground)">🔄 Reintentar</button>
    </div>
  </div>`;
}
function answerQuiz(lvId, chosen) {
  if (quizState.answered) return;
  quizState.answered = true;
  const qs = QUIZZES[lvId];
  const q = qs[quizState.current];
  const opts = document.querySelectorAll('#qOpts .quiz-opt');
  opts.forEach(b => b.disabled = true);
  const fb = document.getElementById('qFeedback');
  if (chosen === q.a) {
    opts[chosen].classList.add('correct');
    quizState.score++;
    document.getElementById('qScore').textContent = quizState.score;
    fb.textContent = '✅ ¡Correcto! 잘 했어요!';
    fb.style.background = '#22c55e22'; fb.style.color = '#16a34a';
  } else {
    opts[chosen].classList.add('wrong');
    opts[q.a].classList.add('correct');
    fb.textContent = `❌ La respuesta correcta es: ${q.opts[q.a]}`;
    fb.style.background = '#ef444422'; fb.style.color = '#dc2626';
  }
  fb.classList.remove('hidden');
  if (quizState.current < qs.length - 1) {
    document.getElementById('nextQBtn').classList.remove('hidden');
  } else {
    setTimeout(() => showQuizComplete(lvId), 800);
  }
}
function nextQuestion(lvId) {
  quizState.current++;
  quizState.answered = false;
  const qs = QUIZZES[lvId];
  const q = qs[quizState.current];
  document.getElementById('qNum').textContent = quizState.current + 1;
  document.getElementById('quizProg').style.width = `${(quizState.current+1)*100/qs.length}%`;
  document.getElementById('qText').textContent = q.q;
  document.getElementById('qOpts').innerHTML = q.opts.map((o,i)=>`<button class="quiz-opt" onclick="answerQuiz('${lvId}',${i})">${o}</button>`).join('');
  document.getElementById('qFeedback').classList.add('hidden');
  document.getElementById('nextQBtn').classList.add('hidden');
}
function showQuizComplete(lvId) {
  document.getElementById('quizCard').classList.add('hidden');
  document.getElementById('nextQBtn').classList.add('hidden');
  const complete = document.getElementById('quizComplete');
  complete.classList.remove('hidden');
  document.getElementById('finalScore').textContent = `${quizState.score}/${QUIZZES[lvId].length}`;
}
function restartQuiz(lvId) {
  document.getElementById('sectionContent').outerHTML = `<div id="sectionContent" class="fade-in">${renderEjercicios(lvId)}</div>`;
}

/* ═══════  MATCHING GAME  ═══════ */
let matchState = { sel: null, matched: 0, total: 0 };
function renderMatchGame(lvId) {
  const pairs = MATCH_PAIRS[lvId] || [];
  matchState = { sel: null, matched: 0, total: pairs.length };
  // Shuffle
  const leftCards  = pairs.map((p,i)=>({id:`k${i}`,text:p.k,pair:i,type:'k'}));
  const rightCards = pairs.map((p,i)=>({id:`e${i}`,text:p.e,pair:i,type:'e'}));
  shuffle(rightCards);
  let h = `<div id="matchGameArea"><div class="grid grid-cols-2 gap-3">
    <div class="space-y-2">`;
  leftCards.forEach(c => { h += `<div class="match-card" id="mc-${c.id}" onclick="matchClick('${c.id}',${c.pair},'${c.type}')">${c.text}</div>`; });
  h += `</div><div class="space-y-2">`;
  rightCards.forEach(c => { h += `<div class="match-card" id="mc-${c.id}" onclick="matchClick('${c.id}',${c.pair},'${c.type}')">${c.text}</div>`; });
  h += `</div></div>
    <div id="matchResult" class="hidden text-center mt-4 p-4 rounded-xl bg-[var(--accent)] font-bold">🎊 ¡Excelente! Todas las parejas encontradas.</div>
  </div>`;
  return h;
}
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }
function matchClick(id, pair, type) {
  const el = document.getElementById('mc-'+id);
  if (!el || el.classList.contains('matched')) return;
  if (!matchState.sel) {
    matchState.sel = {id, pair, type, el};
    el.classList.add('selected');
    return;
  }
  const prev = matchState.sel;
  if (prev.id === id) { el.classList.remove('selected'); matchState.sel = null; return; }
  if (prev.pair === pair && prev.type !== type) {
    // correct
    prev.el.classList.remove('selected'); prev.el.classList.add('matched');
    el.classList.add('matched');
    matchState.matched++;
    if (matchState.matched === matchState.total) {
      document.getElementById('matchResult')?.classList.remove('hidden');
    }
  } else {
    // wrong
    prev.el.classList.add('wrong-shake'); el.classList.add('wrong-shake');
    setTimeout(() => { prev.el.classList.remove('selected','wrong-shake'); el.classList.remove('wrong-shake'); }, 400);
  }
  matchState.sel = null;
}
</script>
