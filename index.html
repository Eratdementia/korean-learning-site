<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>한국어 배우기 · Aprende Coreano</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    *{box-sizing:border-box;}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--background);color:var(--foreground);margin:0;padding:0;}

    /* ── Hero Particle Banner ── */
    #hero-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
    #hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--primary),var(--accent));}

    /* ── Level Tabs ── */
    .level-tab{padding:10px 20px;border-radius:9999px;cursor:pointer;font-weight:700;transition:background .2s,color .2s;border:2px solid transparent;white-space:nowrap;}
    .level-tab.active{background:var(--primary);color:var(--primary-foreground);}
    .level-tab:not(.active){background:var(--card);color:var(--muted-foreground);border-color:var(--border);}

    /* ── Section Tabs ── */
    .section-tab{padding:8px 16px;cursor:pointer;border-bottom:3px solid transparent;font-weight:600;white-space:nowrap;transition:color .2s,border-color .2s;color:var(--muted-foreground);}
    .section-tab.active{border-bottom-color:var(--primary);color:var(--primary);}

    /* ── Cards ── */
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;}

    /* ── Hangul Cells ── */
    .hangul-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:10px;padding:10px 6px;cursor:pointer;transition:transform .15s,box-shadow .15s;background:var(--card);}
    .hangul-cell:hover{transform:scale(1.08);box-shadow:0 4px 16px rgba(0,0,0,.18);}
    .hangul-cell .kor{font-size:2rem;font-weight:700;line-height:1;}
    .hangul-cell .rom{font-size:.78rem;color:var(--muted-foreground);margin-top:4px;}
    .hangul-cell .play{font-size:.7rem;color:var(--primary);margin-top:2px;}

    /* ── Flashcards ── */
    .flashcard-wrap{perspective:900px;cursor:pointer;}
    .flashcard{width:100%;min-height:200px;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1);}
    .flashcard.flipped{transform:rotateY(180deg);}
    .flashcard-face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:16px;padding:24px;border:1.5px solid var(--border);background:var(--card);}
    .flashcard-back{transform:rotateY(180deg);background:var(--accent);}

    /* ── Quiz ── */
    .quiz-opt{display:block;width:100%;text-align:left;padding:12px 16px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;background:var(--card);color:var(--foreground);margin-bottom:8px;transition:background .15s,border-color .15s;}
    .quiz-opt:hover:not(:disabled){border-color:var(--primary);background:var(--accent);}
    .quiz-opt.correct{border-color:#22c55e;background:#dcfce7;color:#15803d;}
    .quiz-opt.wrong{border-color:#ef4444;background:#fee2e2;color:#991b1b;}

    /* ── Matching Game ── */
    .match-btn{padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;background:var(--card);color:var(--foreground);text-align:center;transition:all .15s;font-size:.85rem;}
    .match-btn.selected{border-color:var(--primary);background:var(--accent);color:var(--primary);}
    .match-btn.matched{border-color:#22c55e;background:#dcfce7;color:#15803d;pointer-events:none;opacity:.7;}
    .match-btn.wrong-shake{animation:shake .3s;}
    @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px)};}

    /* ── Verb table ── */
    .verb-table th{background:var(--accent);color:var(--foreground);padding:8px 10px;font-weight:700;font-size:.8rem;border:1px solid var(--border);}
    .verb-table td{padding:7px 10px;font-size:.82rem;border:1px solid var(--border);background:var(--card);}
    .verb-table tr:hover td{background:var(--accent);}

    /* ── Hangul Builder ── */
    .hb-key{padding:8px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:var(--card);font-size:1.1rem;font-weight:700;text-align:center;transition:transform .1s,box-shadow .1s;}
    .hb-key:hover{transform:scale(1.12);box-shadow:0 2px 8px rgba(0,0,0,.2);}
    .hb-key.selected{border-color:var(--primary);background:var(--accent);color:var(--primary);}

    /* ── Fill-in-the-blank ── */
    .fitb-input{border:1.5px solid var(--border);border-radius:8px;padding:4px 10px;background:var(--card);color:var(--foreground);font-size:.9rem;width:120px;outline:none;transition:border-color .15s;}
    .fitb-input:focus{border-color:var(--primary);}
    .fitb-input.correct{border-color:#22c55e;background:#dcfce7;}
    .fitb-input.wrong{border-color:#ef4444;background:#fee2e2;}

    /* ── Word Order ── */
    .wo-token{display:inline-block;padding:6px 12px;border:1.5px solid var(--border);border-radius:9999px;cursor:pointer;background:var(--card);color:var(--foreground);font-size:.85rem;margin:4px;transition:all .15s;user-select:none;}
    .wo-token:hover{border-color:var(--primary);background:var(--accent);}
    .wo-token.placed{opacity:.4;cursor:default;pointer-events:none;}
    .wo-slot{display:inline-block;min-width:70px;padding:6px 12px;border-bottom:2px solid var(--primary);margin:4px;text-align:center;font-size:.85rem;cursor:pointer;color:var(--primary);min-height:34px;}

    /* ── TTS button ── */
    .tts-btn{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:9999px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:.75rem;color:var(--primary);transition:background .15s;}
    .tts-btn:hover{background:var(--accent);}

    /* ── Progress bar ── */
    .progress-bar{height:8px;border-radius:9999px;background:var(--border);overflow:hidden;}
    .progress-fill{height:100%;background:var(--primary);border-radius:9999px;transition:width .4s;}

    /* ── Dialogs ── */
    .dialog-line{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;padding:10px 0;border-bottom:1px solid var(--border);}
    .dialog-line:last-child{border-bottom:none;}

    /* ── Responsive scrollable tabs ── */
    .tabs-scroll{overflow-x:auto;scrollbar-width:none;}
    .tabs-scroll::-webkit-scrollbar{display:none;}

    /* ── Utility ── */
    .hidden{display:none!important;}
    .section-panel{display:none;}
    .section-panel.active{display:block;}
    
    /* ── Reading cards ── */
    .reading-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px;}
    .reading-card .korean-text{font-size:1.05rem;line-height:1.9;color:var(--foreground);border-left:3px solid var(--primary);padding-left:14px;}

    /* ── Particle canvas ── */
    canvas{display:block;}

//  PARTICLE HERO
// ════════════════════════════════════════════════════════════
(function(){
  const canvas=document.getElementById('hero-canvas');
  const hero=document.getElementById('hero');
  const ctx=canvas.getContext('2d');
  const chars='가나다라마바사아자차카타파하한국어배우기';
  let particles=[];
  function resize(){canvas.width=hero.offsetWidth;canvas.height=hero.offsetHeight;}
  function mkParticle(){
    return{x:Math.random()*canvas.width,y:Math.random()*canvas.height,
      vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,
      ch:chars[Math.floor(Math.random()*chars.length)],
      size:12+Math.random()*20,alpha:0.08+Math.random()*.18,
      rot:Math.random()*Math.PI*2,rotV:(Math.random()-.5)*.01};
  }
  function init(){resize();particles=Array.from({length:50},mkParticle);}
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.globalAlpha=p.alpha;ctx.fillStyle='#ffffff';
      ctx.font=`bold ${p.size}px sans-serif`;ctx.textAlign='center';
      ctx.fillText(p.ch,0,0);ctx.restore();
      p.x+=p.vx;p.y+=p.vy;p.rot+=p.rotV;
      if(p.x<-30||p.x>canvas.width+30||p.y<-30||p.y>canvas.height+30){
        Object.assign(p,mkParticle());
        p.x=Math.random()<.5?-10:canvas.width+10;
      }
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',init);
  init();draw();
})();

// ════════════════════════════════════════════════════════════
//  TTS UTILITY
// ════════════════════════════════════════════════════════════
function speak(text){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ko-KR';u.rate=0.85;
  window.speechSynthesis.speak(u);
}
function ttsBtn(text,label='🔊'){
  return `<button class="tts-btn" onclick="speak('${text.replace(/'/g,"\\'")}')">
    ${label} <span style="color:var(--muted-foreground);">${text.length>12?text.slice(0,10)+'…':text}</span>
  </button>`;
}

// ════════════════════════════════════════════════════════════
//  LOCALSTORAGE PROGRESS
// ════════════════════════════════════════════════════════════
function saveScore(level,section,score){
  const key='kor_scores';
  const data=JSON.parse(localStorage.getItem(key)||'{}');
  if(!data[level])data[level]={};
  data[level][section]=score;
  localStorage.setItem(key,JSON.stringify(data));
  updateOverallProgress();
}
function getScore(level,section){
  const data=JSON.parse(localStorage.getItem('kor_scores')||'{}');
  return (data[level]&&data[level][section])||0;
}
function updateOverallProgress(){
  const data=JSON.parse(localStorage.getItem('kor_scores')||'{}');
  let total=0,count=0;
  Object.values(data).forEach(lvl=>Object.values(lvl).forEach(s=>{total+=s;count++;}));
  const pct=count?Math.min(100,Math.round(total/count)):0;
  const fill=document.getElementById('overall-fill');
  if(fill)fill.style.width=pct+'%';
}

// ════════════════════════════════════════════════════════════
//  HANGUL SYLLABLE BUILDER LOGIC
// ════════════════════════════════════════════════════════════
// Unicode hangul: syllable = 가(0xAC00) + (initial*21 + vowel)*28 + final
const INITIAL_IDX={ㄱ:0,ㄲ:1,ㄴ:2,ㄷ:3,ㄸ:4,ㄹ:5,ㅁ:6,ㅂ:7,ㅃ:8,ㅅ:9,ㅆ:10,ㅇ:11,ㅈ:12,ㅉ:13,ㅊ:14,ㅋ:15,ㅌ:16,ㅍ:17,ㅎ:18};
const VOWEL_IDX={ㅏ:0,ㅐ:1,ㅑ:2,ㅒ:3,ㅓ:4,ㅔ:5,ㅕ:6,ㅖ:7,ㅗ:8,ㅘ:9,ㅙ:10,ㅚ:11,ㅛ:12,ㅜ:13,ㅝ:14,ㅞ:15,ㅟ:16,ㅠ:17,ㅡ:18,ㅢ:19,ㅣ:20};
const FINAL_IDX={'':0,ㄱ:1,ㄲ:2,ㄳ:3,ㄴ:4,ㄵ:5,ㄶ:6,ㄷ:7,ㄹ:8,ㄺ:9,ㄻ:10,ㄼ:11,ㄽ:12,ㄾ:13,ㄿ:14,ㅀ:15,ㅁ:16,ㅂ:17,ㅄ:18,ㅅ:19,ㅆ:20,ㅇ:21,ㅈ:22,ㅊ:23,ㅋ:24,ㅌ:25,ㅍ:26,ㅎ:27};
let hbSel={initial:null,vowel:null,final:''};
function composeSyllable(i,v,f){
  const ic=INITIAL_IDX[i]??0, vc=VOWEL_IDX[v]??0, fc=FINAL_IDX[f]??0;
  return String.fromCodePoint(0xAC00+(ic*21+vc)*28+fc);
}
function hbSelect(type,char){
  hbSel[type]=char;
  renderHangulBuilder();
}
function renderHangulBuilder(){
  const preview=document.getElementById('hb-preview');
  const romPreview=document.getElementById('hb-rom');
  if(!preview)return;
  if(hbSel.initial&&hbSel.vowel){
    const syl=composeSyllable(hbSel.initial,hbSel.vowel,hbSel.final);
    preview.textContent=syl;
    const initRom=INITIALS.find(x=>x.char===hbSel.initial)?.rom||'';
    const vowRom=VOWELS.find(x=>x.char===hbSel.vowel)?.rom||'';
    const finRom=hbSel.final?FINALS.find(x=>x.char===hbSel.final)?.rom||'':'';
    romPreview.textContent=initRom+vowRom+(finRom?'+'+finRom:'');
  } else {
    preview.textContent=(hbSel.initial||'?')+(hbSel.vowel||'');
    romPreview.textContent='Selecciona consonante y vocal';
  }
  // Update selected states
  document.querySelectorAll('.hb-key').forEach(btn=>{
    const type=btn.dataset.type, char=btn.dataset.char;
    btn.classList.toggle('selected',hbSel[type]===char);
  });
}

              </div>
            </div>
          `).join('')}

function playDialog(di,lvl){
  const dialogs=getDialogues(lvl);
  const lines=dialogs[di]?.lines||[];

    if(i<lines.length){speak(lines[i].kor);i++;setTimeout(next,2000);}
  }
  next();
}

function getFlashcardData(lvl){
  const v=getVocab(lvl);
  return v.map(w=>({front:w[0],rom:w[1],back:w[2]}));
}
let fcIndex={};let fcFlipped={};
function initFlashcards(lvl){
  fcIndex[lvl]=0;fcFlipped[lvl]=false;
  renderCardView(lvl);
}
function renderFlashcards(lvl){
  const data=getFlashcardData(lvl);
  return `
  <div class="card max-w-lg mx-auto text-center">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-bold text-lg" style="color:var(--foreground)">Flashcards ${lvl}</h3>
      <div id="fc-counter-${lvl}" class="text-sm" style="color:var(--muted-foreground)">1 / ${data.length}</div>
    </div>
    <div id="fc-wrap-${lvl}" class="flashcard-wrap mb-6" onclick="flipCard('${lvl}')">
      <div id="fc-${lvl}" class="flashcard">
        <div class="flashcard-face flashcard-front" id="fc-front-${lvl}">
          <div class="text-5xl font-black mb-3" id="fc-kor-${lvl}" style="color:var(--primary)"></div>
          <div class="text-sm" id="fc-rom-${lvl}" style="color:var(--muted-foreground)"></div>
          <div class="text-xs mt-4" style="color:var(--muted-foreground)">Haz clic para ver la traducción</div>
        </div>
        <div class="flashcard-face flashcard-back" id="fc-back-${lvl}">
          <div class="text-2xl font-bold" id="fc-trans-${lvl}" style="color:var(--foreground)"></div>
          <div class="text-xs mt-4" style="color:var(--muted-foreground)">Haz clic para volver</div>
        </div>
      </div>
    </div>
    <div class="flex gap-3 justify-center flex-wrap">
      <button class="tts-btn px-4 py-2" onclick="prevCard('${lvl}')">← Anterior</button>
      <button class="tts-btn px-4 py-2" onclick="speakCard('${lvl}')">🔊 Escuchar</button>
      <button class="tts-btn px-4 py-2" onclick="nextCard('${lvl}')">Siguiente →</button>
    </div>
    <div class="mt-4 text-xs" style="color:var(--muted-foreground)">⌨️ Espacio = voltear · ← → = navegar</div>
    <div class="progress-bar mt-4"><div id="fc-progress-${lvl}" class="progress-fill" style="width:${100/getFlashcardData(lvl).length}%"></div></div>
  </div>`;
}
function renderCardView(lvl){
  const data=getFlashcardData(lvl);
  const idx=fcIndex[lvl]||0;
  const card=data[idx]||data[0];
  const korEl=document.getElementById('fc-kor-'+lvl);
  const romEl=document.getElementById('fc-rom-'+lvl);
  const transEl=document.getElementById('fc-trans-'+lvl);
  const counter=document.getElementById('fc-counter-'+lvl);
  const progress=document.getElementById('fc-progress-'+lvl);
  const fcEl=document.getElementById('fc-'+lvl);
  if(korEl)korEl.textContent=card.front;
  if(romEl)romEl.textContent=card.rom;
  if(transEl)transEl.textContent=card.back;
  if(counter)counter.textContent=`${idx+1} / ${data.length}`;
  if(progress)progress.style.width=`${((idx+1)/data.length)*100}%`;
  if(fcEl){fcEl.classList.remove('flipped');fcFlipped[lvl]=false;}
}
function flipCard(lvl){
  const fcEl=document.getElementById('fc-'+lvl);
  if(!fcEl)return;
  fcFlipped[lvl]=!fcFlipped[lvl];
  fcEl.classList.toggle('flipped',fcFlipped[lvl]);
}
function nextCard(lvl){
  const data=getFlashcardData(lvl);
  fcIndex[lvl]=((fcIndex[lvl]||0)+1)%data.length;
  renderCardView(lvl);
}
function prevCard(lvl){
  const data=getFlashcardData(lvl);
  fcIndex[lvl]=((fcIndex[lvl]||0)-1+data.length)%data.length;
  renderCardView(lvl);
}
function speakCard(lvl){
  const data=getFlashcardData(lvl);
  const idx=fcIndex[lvl]||0;
  speak(data[idx].front);
}

    <div class="card" id="match-section-${lvl}">

      <button class="tts-btn px-4 py-2 mb-4" onclick="startMatch('${lvl}')">▶ Iniciar / Reiniciar</button>
      <div id="match-container-${lvl}" class="grid grid-cols-2 sm:grid-cols-4 gap-2"></div>
      <div id="matchResult-${lvl}" class="hidden text-center mt-4 p-4 rounded-xl" style="background:var(--accent)">
        <div class="text-2xl font-black" style="color:var(--primary)">🎉 ¡Completado!</div>
        <div class="text-sm mt-1" style="color:var(--muted-foreground)">¡Excelente trabajo! Reinicia para practicar de nuevo.</div>
      </div>
    </div>

    <!-- ── FILL IN THE BLANK ── -->
    <div class="card" id="fitb-section-${lvl}">
      <h3 class="text-xl font-bold mb-4" style="color:var(--foreground)">✏️ Rellena el espacio — 8 oraciones</h3>
      <div id="fitb-container-${lvl}"></div>
      <div class="flex gap-3 mt-4 flex-wrap">
        <button class="tts-btn px-4 py-2" onclick="checkFitb('${lvl}')">✓ Comprobar</button>
        <button class="tts-btn px-4 py-2" onclick="resetFitb('${lvl}')">↺ Reiniciar</button>
      </div>
      <div id="fitb-result-${lvl}" class="mt-3 text-sm font-bold" style="color:var(--primary)"></div>
    </div>

    <!-- ── WORD ORDER ── -->
    <div class="card" id="wo-section-${lvl}">
      <h3 class="text-xl font-bold mb-4" style="color:var(--foreground)">🔀 Orden de palabras — 5 oraciones</h3>
      <div id="wo-container-${lvl}"></div>
    </div>

  </div>`;
}

// ── QUIZ LOGIC ──
function renderQuiz(lvl){
  const qs=QUIZZES[lvl]||[];
  if(!qs.length)return;
  quizState[lvl]={current:0,score:0,answered:false};
  const c=document.getElementById('quiz-container-'+lvl);
  if(c)c.innerHTML=buildQuizQuestion(lvl);
}
function buildQuizQuestion(lvl){
  const qs=QUIZZES[lvl];
  const st=quizState[lvl];
  if(!qs||st.current>=qs.length){
    saveScore(lvl,'quiz',st.score);
    return `<div class="text-center p-6">
      <div class="text-5xl mb-3">${st.score>=8?'🏆':st.score>=5?'👍':'📚'}</div>
      <div class="text-2xl font-black mb-2" style="color:var(--primary)">${st.score}/10</div>
      <div class="text-base mb-4" style="color:var(--foreground)">${st.score>=8?'¡Excelente!':st.score>=5?'¡Bien hecho!':'Sigue practicando'}</div>
      <button class="tts-btn px-6 py-2" onclick="restartQuiz('${lvl}')">↺ Reintentar</button>
    </div>`;
  }
  const q=qs[st.current];
  return `
    <div class="mb-3 text-sm font-semibold" style="color:var(--muted-foreground)">Pregunta ${st.current+1} de 10 · Puntuación: ${st.score}</div>
    <div class="text-lg font-bold mb-4" style="color:var(--foreground)">${q.q}</div>
    <div>
      ${q.opts.map((opt,i)=>`
        <button class="quiz-opt" id="qopt-${lvl}-${i}" onclick="answerQuiz('${lvl}',${i})">${opt}</button>
      `).join('')}
    </div>
  `;
}
function answerQuiz(lvl,chosen){
  const st=quizState[lvl];
  if(st.answered)return;
  st.answered=true;
  const q=QUIZZES[lvl][st.current];
  if(chosen===q.a)st.score++;
  document.querySelectorAll(`[id^="qopt-${lvl}-"]`).forEach((btn,i)=>{
    btn.disabled=true;
    if(i===q.a)btn.classList.add('correct');
    if(i===chosen&&chosen!==q.a)btn.classList.add('wrong');
  });
  setTimeout(()=>{
    st.current++;st.answered=false;
    const c=document.getElementById('quiz-container-'+lvl);
    if(c)c.innerHTML=buildQuizQuestion(lvl);
  },1200);
}
function restartQuiz(lvl){
  quizState[lvl]={current:0,score:0,answered:false};
  const c=document.getElementById('quiz-container-'+lvl);
  if(c)c.innerHTML=buildQuizQuestion(lvl);
}

// ── MATCHING GAME LOGIC ──
function startMatch(lvl){
  const pairs=MATCHING[lvl]||[];
  matchState[lvl]={sel:null,matched:0,total:pairs.length};
  const result=document.getElementById('matchResult-'+lvl);
  if(result)result.classList.add('hidden');
  const c=document.getElementById('match-container-'+lvl);
  if(!c)return;
  // Create shuffled items: korean side + spanish side
  const kor=pairs.map((p,i)=>({text:p[0],pair:i,type:'kor'}));
  const esp=pairs.map((p,i)=>({text:p[1],pair:i,type:'esp'}));
  const all=shuffle([...kor,...esp]);
  c.innerHTML=all.map((item,i)=>`
    <button class="match-btn" id="mc-${lvl}-${i}" onclick="matchClick('${lvl}',${i},${item.pair},'${item.type}')">
      ${item.text}
    </button>
  `).join('');
  matchState[lvl].items=all;
}
function matchClick(lvl,id,pair,type){
  const ms=matchState[lvl];if(!ms)return;
  const el=document.getElementById('mc-'+lvl+'-'+id);
  if(!el||el.classList.contains('matched'))return;
  if(!ms.sel){
    ms.sel={id,pair,type,el};el.classList.add('selected');return;
  }
  const prev=ms.sel;
  if(prev.id===id){el.classList.remove('selected');ms.sel=null;return;}
  if(prev.pair===pair&&prev.type!==type){
    prev.el.classList.remove('selected');prev.el.classList.add('matched');
    el.classList.add('matched');ms.matched++;
    if(ms.matched===ms.total){
      document.getElementById('matchResult-'+lvl)?.classList.remove('hidden');
      saveScore(lvl,'match',100);
    }
  } else {
    prev.el.classList.add('wrong-shake');el.classList.add('wrong-shake');
    setTimeout(()=>{prev.el.classList.remove('selected','wrong-shake');el.classList.remove('wrong-shake');},400);
  }
  ms.sel=null;
}

// ── FILL-IN-THE-BLANK LOGIC ──
function renderFitb(lvl){
  const items=FITB[lvl]||[];
  const c=document.getElementById('fitb-container-'+lvl);
  if(!c)return;
  c.innerHTML=items.map((item,i)=>`
    <div class="mb-4 p-3 rounded-xl" style="background:var(--accent)">
      <div class="text-base font-medium mb-2 flex flex-wrap items-center gap-2" style="color:var(--foreground)">
        <button class="tts-btn" onclick="speak('${item.sentence.replace('___',item.blank).replace(/'/g,"\\'")}')">🔊</button>
        ${item.sentence.replace('___',`<input class="fitb-input" id="fitb-${lvl}-${i}" placeholder="___" />`)}
      </div>
      <div class="text-xs" style="color:var(--muted-foreground)">💡 ${item.hint}</div>
    </div>
  `).join('');
}
function checkFitb(lvl){
  const items=FITB[lvl]||[];
  let correct=0;
  items.forEach((item,i)=>{
    const inp=document.getElementById(`fitb-${lvl}-${i}`);
    if(!inp)return;
    const val=inp.value.trim();
    if(val===item.blank){correct++;inp.classList.add('correct');inp.classList.remove('wrong');}
    else{inp.classList.add('wrong');inp.classList.remove('correct');}
  });
  const r=document.getElementById('fitb-result-'+lvl);
  if(r){
    r.textContent=`✓ ${correct}/${items.length} correctas`;
    if(correct===items.length)saveScore(lvl,'fitb',100);
  }
}
function resetFitb(lvl){
  renderFitb(lvl);
  const r=document.getElementById('fitb-result-'+lvl);
  if(r)r.textContent='';
}

// ── WORD ORDER LOGIC ──
function renderWordOrder(lvl){
  const exercises=WORD_ORDER[lvl]||[];
  const c=document.getElementById('wo-container-'+lvl);
  if(!c)return;
  woState[lvl]=exercises.map(ex=>({placed:[],done:false}));
  c.innerHTML=exercises.map((ex,ei)=>`
    <div class="mb-6 p-4 rounded-xl" style="background:var(--accent)">
      <div class="text-sm font-semibold mb-2" style="color:var(--muted-foreground)">Oración ${ei+1}: <em>${ex.trans}</em></div>
      <div id="wo-tokens-${lvl}-${ei}" class="mb-3 flex flex-wrap gap-1">
        ${shuffle([...ex.words]).map((w,wi)=>`<button class="wo-token" id="wot-${lvl}-${ei}-${wi}" data-word="${w}" onclick="woTokenClick('${lvl}',${ei},this)">${w}</button>`).join('')}
      </div>
      <div id="wo-answer-${lvl}-${ei}" class="flex flex-wrap items-center gap-1 min-h-[36px] p-2 rounded-xl border" style="border-color:var(--primary);border-style:dashed;min-width:200px">
        <span class="text-xs" style="color:var(--muted-foreground)" id="wo-placeholder-${lvl}-${ei}">Haz clic en las palabras en orden</span>
      </div>
      <div class="flex gap-2 mt-2">
        <button class="tts-btn" onclick="checkWordOrder('${lvl}',${ei})">✓ Comprobar</button>
        <button class="tts-btn" onclick="resetWordOrder('${lvl}',${ei})">↺</button>
      </div>
      <div id="wo-result-${lvl}-${ei}" class="mt-2 text-sm font-bold" style="color:var(--primary)"></div>
    </div>
  `).join('');
}
function woTokenClick(lvl,ei,btn){
  if(btn.classList.contains('placed'))return;
  const word=btn.dataset.word;
  if(!woState[lvl])return;
  woState[lvl][ei].placed.push(word);
  btn.classList.add('placed');
  const answerEl=document.getElementById(`wo-answer-${lvl}-${ei}`);
  const placeholder=document.getElementById(`wo-placeholder-${lvl}-${ei}`);
  if(placeholder)placeholder.style.display='none';
  if(answerEl){
    const span=document.createElement('span');
    span.className='wo-token';span.textContent=word;
    span.style.cursor='default';
    answerEl.appendChild(span);
  }
}
function checkWordOrder(lvl,ei){
  const ex=WORD_ORDER[lvl][ei];
  const st=woState[lvl][ei];
  const placed=st.placed.join(' ');
  const r=document.getElementById(`wo-result-${lvl}-${ei}`);
  if(placed===ex.answer){
    if(r){r.textContent='✓ ¡Correcto!';r.style.color='#22c55e';}
    document.getElementById(`wo-answer-${lvl}-${ei}`)?.querySelectorAll('.wo-token').forEach(t=>t.style.borderColor='#22c55e');
  } else {
    if(r){r.textContent=`✗ Respuesta correcta: ${ex.answer}`;r.style.color='#ef4444';}
  }
}
function resetWordOrder(lvl,ei){
  woState[lvl][ei]={placed:[],done:false};
  renderWordOrder(lvl);// re-render all — simpler
}

// ════════════════════════════════════════════════════════════
//  POST-RENDER INIT (exercises section)
// ════════════════════════════════════════════════════════════
const origRenderSection=renderSection;
function renderSection(lvl,sec){
  origRenderSection(lvl,sec);
  if(sec==='Ejercicios'){
    setTimeout(()=>{
      renderQuiz(lvl);
      startMatch(lvl);
      renderFitb(lvl);
      renderWordOrder(lvl);
    },50);
  }
}

// ════════════════════════════════════════════════════════════
//  UTILITY
// ════════════════════════════════════════════════════════════
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}

// ════════════════════════════════════════════════════════════
//  KEYBOARD NAVIGATION
// ════════════════════════════════════════════════════════════
document.addEventListener('keydown',e=>{
  const sec=currentSection[currentLevel];
  if(sec==='Flashcards'){
    if(e.key==='ArrowRight')nextCard(currentLevel);
    if(e.key==='ArrowLeft')prevCard(currentLevel);
    if(e.key===' '){e.preventDefault();flipCard(currentLevel);}
  }
});

// ════════════════════════════════════════════════════════════
//  BOOT
// ════════════════════════════════════════════════════════════
buildLevelTabs();
selectLevel('A1');
updateOverallProgress();
</script>
